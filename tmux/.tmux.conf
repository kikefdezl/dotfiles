# allows nvim colors
set-option -ga terminal-overrides ",xterm-256color:Tc"

# makes ESC more responsive
set-option -g escape-time 10

set -g mouse on

bind-key q kill-window
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind V split-window -h
bind H split-window -v

# opens a new pane in the current working directory
bind p new-window -c "#{pane_current_path}"

set -g status-fg "#2e3440"
set -g status-bg "#d08770"

# for using shift-enter in pi agent
set -g extended-keys on
set -g extended-keys-format csi-u

# changes color of the bar when the prefix (Ctrl + B) is pressed
set -g status-left '#{?client_prefix,#[bg=cyan][B]#[bg=default] ,[#S] }'

# show current directory name and current command (unless it's just zsh)
set-option -g automatic-rename-format '#{b:pane_current_path}#{?#{==:#{pane_current_command},zsh},,:#{pane_current_command}}'

# hide the right side of the status bar (date/time)
set -g status-right ''

# make the number white for inactive tabs - invert color for active tabs
set -g window-status-format '#[fg=#d8dee9,bold]#I#[default]:#W '
set -g window-status-current-format '#[bg=#d8dee9, bold] #I:#W '

# Alt + number switches directly to that window (no prefix needed)
bind -n M-0 select-window -t 0
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9
